name: Supply Chain Security

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Inventory and scan dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Verify dependency manifests and frontend lockfile
        run: python scripts/supply_chain.py verify

      - name: Resolve Python dependencies in an isolated environment
        id: python-env
        run: |
          python -m venv .venv-supply-chain
          .venv-supply-chain/bin/python -m pip install \
            --requirement requirements.txt \
            ".[dev]" \
            pip-audit==2.9.0
          .venv-supply-chain/bin/python -m pip check

      - name: Generate Python SPDX SBOM
        run: >-
          .venv-supply-chain/bin/python scripts/supply_chain.py python-sbom
          --output artifacts/supply-chain/python-sbom.spdx.json

      - name: Install frontend dependencies from the committed lockfile
        id: frontend-install
        run: npm ci --ignore-scripts --prefix frontend

      - name: Generate frontend SPDX SBOM
        run: >-
          python scripts/supply_chain.py frontend-sbom
          --output artifacts/supply-chain/frontend-sbom.spdx.json

      - name: Generate dependency license inventory
        run: >-
          python scripts/supply_chain.py licenses
          --output artifacts/supply-chain/license-inventory.json
          artifacts/supply-chain/python-sbom.spdx.json
          artifacts/supply-chain/frontend-sbom.spdx.json

      - name: Run Python vulnerability audit
        if: always() && steps.python-env.outcome == 'success'
        run: .venv-supply-chain/bin/pip-audit --strict

      - name: Run npm vulnerability audit
        if: always() && steps.frontend-install.outcome == 'success'
        run: npm audit --prefix frontend --audit-level=high

      - name: Generate report checksums
        if: always()
        run: |
          files=()
          for file in artifacts/supply-chain/python-sbom.spdx.json artifacts/supply-chain/frontend-sbom.spdx.json artifacts/supply-chain/license-inventory.json; do
            if [ -f "$file" ]; then files+=("$file"); fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            python scripts/supply_chain.py checksums --output artifacts/supply-chain/SHA256SUMS "${files[@]}"
          fi

      - name: Upload SBOM and checksum reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinelcrypt-supply-chain-${{ github.run_id }}
          path: artifacts/supply-chain/
          if-no-files-found: warn
          retention-days: 30

  secrets:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.23.x"

      - name: Install pinned Gitleaks release
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3

      - name: Scan repository and Git history
        run: |
          "$(go env GOPATH)/bin/gitleaks" detect \
            --source . \
            --redact \
            --verbose
