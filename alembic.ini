# Alembic configuration for SentinelCrypt AI
# Run from the project root: alembic upgrade head

[alembic]
script_location = backend/migrations
prepend_sys_path = .

# No sqlalchemy.url here on purpose: backend/migrations/env.py fills it from
# settings.DATABASE_URL (which honours the DATABASE_URL env var). A URL in
# this file would silently beat overrides such as Docker's volume path.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
